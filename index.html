<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Walkie – ניווט רגלי ותחבורה ציבורית, מהיר וחינמי">
  <title>Walkie</title>

  <!-- שפה, כיוון ומצב לילה – לפני הציור הראשון, כדי שלא יהיה הבהוב (לבן / RTL שמתהפך).
       שפה: עברית תמיד, אלא אם המשתמש בחר אנגלית בהגדרות. מצב לילה: הגדרה שמורה, אחרת לפי המכשיר -->
  <script>
    (function () {
      var s = {};
      try { s = JSON.parse(localStorage.getItem('walkie:settings') || '{}') || {}; } catch (e) {}
      var root = document.documentElement;
      var lang = ['en', 'ru', 'am'].indexOf(s.lang) >= 0 ? s.lang : 'he';
      root.lang = lang;
      root.dir = lang === 'he' ? 'rtl' : 'ltr';
      var dark = s.theme === 'dark' || (s.theme !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#141b25' : '#ffffff');
      document.querySelector('meta[name="color-scheme"]').setAttribute('content', dark ? 'dark' : 'light');
    })();
  </script>

  <!-- "הוספה למסך הבית" (אייפון / אנדרואיד): אייקון, שם, ופתיחה במסך מלא בלי שורת כתובת -->
  <link rel="manifest" href="manifest.webmanifest">

  <link rel="icon" type="image/svg+xml" href="icon.svg">

  <!-- Leaflet והפונט ארוזים עם האפליקציה: המפה עולה גם כשהרשת איטית, ובלי בקשות ל-CDN -->
  <link rel="stylesheet" href="vendor/heebo/heebo.css?v=1.10.0-mvsf7kai">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css?v=1.10.0-mvsf7kai">
  <link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css?v=1.10.0-mvsf7kai">

  <link rel="stylesheet" href="css/navigation.css?v=1.10.0-mvsf7kai">

  <!-- אנימציית פתיחה (~1.5 שנ'): הלוגו מצטייר, ואז עיגול נפתח מהלוגו אל האפליקציה.
       בתוך ה-HTML כדי שתופיע מהפריים הראשון, בהמשך ישיר למסך הפתיחה של אנדרואיד (אותו צבע).
       כל האנימציות כאן הן transform/opacity בלבד – רצות על ה-GPU (compositor), ולכן נשארות חלקות
       ב-120FPS גם כשהאפליקציה עדיין נטענת מתחת (פענוח התחנות, המפה) -->
  <style>
    .intro {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      overflow: hidden;
      pointer-events: none;
      contain: strict;
    }
    /* "טבעת": צבע המותג עם חור שקוף במרכז. מוגדלת (scale) כדי שהחור ייפתח עד פינות המסך */
    .intro-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 150vmax;
      height: 150vmax;
      margin: -75vmax 0 0 -75vmax;
      background: radial-gradient(circle, transparent 54px, #0d9488 55.5px);
      will-change: transform;
      animation: intro-open 0.62s cubic-bezier(0.5, 0, 0.3, 1) 0.86s forwards;
    }
    /* סוגר את החור עד שהעיגול מתחיל להיפתח */
    .intro-plug {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 112px;
      height: 112px;
      margin: -56px 0 0 -56px;
      border-radius: 50%;
      background: #0d9488;
      animation: intro-hide 0.01s steps(1) 0.86s forwards;
    }
    .intro-logo {
      position: relative;
      width: 132px;
      height: 132px;
      will-change: transform, opacity;
      animation:
        intro-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both,
        intro-away 0.4s cubic-bezier(0.55, 0, 1, 0.45) 0.86s forwards;
    }
    .intro-tile { position: absolute; inset: 0; filter: drop-shadow(0 14px 28px rgba(6, 46, 43, 0.35)); }
    /* ה-W "מצטייר" משמאל לימין: חלון עם overflow שזז, והתוכן זז הפוך כדי להישאר במקום */
    .intro-wipe {
      position: absolute;
      inset: 0;
      overflow: hidden;
      transform: translateX(-100%);
      will-change: transform;
      animation: intro-wipe 0.55s cubic-bezier(0.65, 0, 0.35, 1) 0.18s forwards;
    }
    .intro-wipe > svg {
      position: absolute;
      inset: 0;
      transform: translateX(100%);
      will-change: transform;
      animation: intro-wipe 0.55s cubic-bezier(0.65, 0, 0.35, 1) 0.18s forwards;
    }
    .intro-dot {
      position: absolute;
      border-radius: 50%;
      transform: scale(0);
      will-change: transform;
    }
    /* מיקומים לפי הלוגו (viewBox 512 -> 132px) */
    .intro-start { left: 24.5px; top: 38.9px; width: 8.8px; height: 8.8px; background: #0f766e; animation: intro-dot 0.22s ease-out 0.14s forwards; }
    .intro-dest {
      left: 89.95px; top: 30.15px; width: 26.3px; height: 26.3px;
      box-sizing: border-box; border: 3.6px solid #fff; background: #f97316;
      animation: intro-dot 0.34s cubic-bezier(0.34, 1.8, 0.64, 1) 0.62s forwards;
    }
    @keyframes intro-pop { from { transform: scale(0.55); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes intro-wipe { to { transform: translateX(0); } }
    @keyframes intro-dot { to { transform: scale(1); } }
    @keyframes intro-away { to { transform: scale(0.35); opacity: 0; } }
    @keyframes intro-hide { to { opacity: 0; } }
    /* --intro-k: כמה להגדיל כדי שהחור יגיע לפינות המסך (מחושב בסקריפט לפי גודל המסך) */
    @keyframes intro-open { to { transform: scale(var(--intro-k, 12)); } }
    @media (prefers-reduced-motion: reduce) {
      .intro-ring, .intro-plug, .intro-logo, .intro-wipe, .intro-wipe > svg, .intro-dot { animation: none; transform: none; }
      .intro { background: #0d9488; animation: intro-hide 0.3s ease 0.4s forwards; }
    }
  </style>
</head>
<body>
  <div id="intro" class="intro" aria-hidden="true">
    <div class="intro-ring"></div>
    <div class="intro-plug"></div>
    <div class="intro-logo">
      <svg class="intro-tile" viewBox="0 0 512 512">
        <defs>
          <linearGradient id="intro-bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#14b8a6"/>
            <stop offset="1" stop-color="#0f766e"/>
          </linearGradient>
        </defs>
        <rect width="512" height="512" rx="116" fill="url(#intro-bg)"/>
        <rect width="512" height="512" rx="116" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="6"/>
      </svg>
      <div class="intro-wipe">
        <svg viewBox="0 0 512 512">
          <path d="M112 168 L182 352 L256 224 L330 352 L400 168" fill="none" stroke="#062e2b" stroke-opacity="0.18" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 10)"/>
          <path d="M112 168 L182 352 L256 224 L330 352 L400 168" fill="none" stroke="#ffffff" stroke-width="54" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="intro-dot intro-start"></span>
      <span class="intro-dot intro-dest"></span>
    </div>
  </div>
  <script>
    (function () {
      var el = document.getElementById('intro');
      var ring = el.querySelector('.intro-ring');
      // החור (54px) צריך לגדול עד חצי האלכסון של המסך
      var halfDiag = Math.hypot(window.innerWidth, window.innerHeight) / 2;
      ring.style.setProperty('--intro-k', String(Math.ceil((halfDiag + 8) / 54 * 10) / 10));
      // הטבעת בגודל שמכסה בדיוק את המסך (ולא 150vmax) – שכבה קטנה בהרבה לכרטיס המסך, בלי גמגום בתחילת הפתיחה
      var half = Math.ceil(halfDiag) + 4;
      ring.style.width = ring.style.height = (half * 2) + 'px';
      ring.style.margin = (-half) + 'px 0 0 ' + (-half) + 'px';
      var finished = false;
      var done = function () {
        if (finished) return;
        finished = true;
        if (el.parentNode) el.parentNode.removeChild(el);
        window.dispatchEvent(new Event('walkie:intro-done'));
      };
      window.walkieIntroDone = new Promise(function (resolve) { window.addEventListener('walkie:intro-done', resolve, { once: true }); });
      // מסירים בסוף פתיחת העיגול (ובכל מקרה אחרי 2.5 שנ', שלא תיתקע מעל האפליקציה)
      ring.addEventListener('animationend', done);
      el.addEventListener('animationend', function (e) { if (e.target === el) done(); });
      setTimeout(done, 2500);
    })();
  </script>

      </button>
